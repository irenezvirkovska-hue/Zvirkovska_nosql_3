# Локальний запуск Neo4j для ДЗ 3 (MovieLens 1M).
# Запуск:   docker compose up -d
# Браузер:  http://localhost:7474  (логін neo4j, пароль password123 — з умови ДЗ, база лише локальна)
services:
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j_movielens
    ports:
      - "7474:7474"   # Neo4j Browser (веб-інтерфейс)
      - "7687:7687"   # Bolt — протокол для запитів
    environment:
      NEO4J_AUTH: neo4j/password123
      # APOC потрібен для apoc.periodic.iterate (батчі), GDS — для частини 5
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      # Docker на цьому Mac має ~4 ГБ, тому кеш сторінок обмежено явно
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import   # CSV з convert.py -> file:///movies.csv

volumes:
  neo4j_data:
  neo4j_logs:
